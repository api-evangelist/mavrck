name: Mavrck (Later Influence)
description: >-
  Enrichment review for Mavrck — contract discovery, ownership verification, and
  a posture note on the scope of the specification the provider serves publicly.
url: https://raw.githubusercontent.com/api-evangelist/mavrck/refs/heads/main/review.yml
created: '2026-08-12'
modified: '2026-08-12'
reviews:
- date: '2026-08-12'
  rating: 3
  summary: >-
    A previous round recorded Mavrck as having "no public developer API surface".
    That was wrong, and STEP 0b contract discovery corrected it. Mavrck serves TWO
    machine-readable contracts without credentials. The first is a Swagger 2.0
    document at https://api.mavrck.co/api-docs — 2.2 MB, 548 paths, 687 operations,
    1071 definitions — found by probing the API host root rather than the marketing
    host, whose SeedProd landing page answers 200 with the same HTML shell for every
    path including /openapi.json. The second is an OpenAPI 3.0.0 "Later Influence™
    API" (the Reporting API, 11 operations) published on SwaggerHub by owner
    `mavrck`. The provider also publishes one webhook contract, "Workflow Stage
    Change Event Webhook" 1.0.0, on the same SwaggerHub account.

    OWNERSHIP was verified before anything was saved. The platform document declares
    `host: app.splashscore.com`, which is a different domain — but SplashScore, Inc.
    is Mavrck's founding corporate name, the document's own info.title is
    "MAVRCK.IO", the host serves the byte-identical /api-docs response and the
    identical error envelope, and the document is served from api.mavrck.co whose
    load balancer is named prod-public-api-alb. The Reporting API's servers[] names
    https://api.mavrck.co directly and the provider's help centre states in prose
    that "the legacy v1 API [was] previously documented under Mavrck at
    api.mavrck.co". Both contracts belong to this company.
  endpoints:
  - url: https://api.mavrck.co/api-docs
    status: 200
    note: 'Swagger 2.0, 2 199 890 bytes, unauthenticated. The primary find.'
  - url: https://app.splashscore.com/api-docs
    status: 200
    note: Legacy corporate host, byte-identical response.
  - url: https://api.swaggerhub.com/apis/mavrck
    status: 200
    note: 'Two APIs published under SwaggerHub owner `mavrck`.'
  - url: https://api.swaggerhub.com/apis/mavrck/reporting-api/1.2.1
    status: 200
  - url: https://api.swaggerhub.com/apis/mavrck/workflow-stage-change-event-webhook/1.0.0
    status: 200
  - url: https://api.mavrck.co/v1/influencers
    status: 403
    note: '{"type":"RESOURCE_FORBIDDEN_ERROR",...} — proprietary error envelope.'
  - url: https://api.mavrck.co/oauth/token
    status: 401
    note: 'application/problem+json — RFC 9457 shape, unlike the platform surface.'
  - url: https://api.mavrck.co/graphql
    status: 403
    note: Route exists but is gated; no introspection possible, nothing asserted.
  - url: https://api.mavrck.co/openapi.json
    status: 404
  - url: https://api.mavrck.co/.well-known/security.txt
    status: 404
  - url: https://api.mavrck.co/.well-known/agent-card.json
    status: 404
  - url: https://www.mavrck.co/.well-known/agent-card.json
    status: 200
    note: 'SPA catch-all HTML, NOT an agent card. Recorded as a miss; no AgentCard pointer.'
  - url: https://www.mavrck.co/llms.txt
    status: 200
    note: 'Real 400 KB text/plain llms.txt generated by the All in One SEO WordPress plugin.'
  - url: https://mavrck.co/
    status: 0
    note: 'TLS CERTIFICATE_VERIFY_FAILED — the apex certificate has EXPIRED. Only www.mavrck.co has a current one.'
  - url: https://trust.later.com/
    status: 200
    note: 'SafeBase trust centre naming ISO/IEC 27001, SOC 2 Type 1 and SOC 2 Type 2.'
  - url: https://help-influence.later.com/api/v2/help_center/en-us/articles/20462385592087.json
    status: 200
    note: >-
      The HTML article 403s to non-browser clients behind a Cloudflare challenge;
      the Zendesk Help Center JSON API serves the same content anonymously.
  posture_notes:
  - title: The published platform specification describes an internal surface
    detail: >-
      https://api.mavrck.co/api-docs is served to anyone, with no credential, and it
      is not a curated partner contract. 150 of its 687 operations carry an
      `x-handler` naming the internal controller file that implements them
      (e.g. `influencers/influencer_controller.js`), and 140 carry an `x-access`
      role — 125 `administrator`, 16 `root`, 9 `shared-cipher`, 4 `anonymous` and 1
      `mvk-s2s`. `root` and `mvk-s2s` are operator-only roles. The surface includes
      bulk influencer personal data (the GlobalUser schema carries 73 fields across
      contact details, social profiles and audience demographics, with list, preview,
      import, repair and bulk-action operations over it), direct messaging to
      creators, and money movement (Stripe, PayPal, Tipalti, cash payments, gift
      cards).
    action_taken: >-
      The specification is catalogued as research (openapi/, data-model/,
      errors/, conventions/) because it is genuinely public, but it is NOT made
      executable: no Agent Skill and no MCP tool is emitted over any of it, and the
      exclusion is recorded with its reason in skills/_index.yml and
      mcp/mavrck-mcp.yml. Only the 11-operation Reporting API and the published
      webhook were turned into skills.
    recommended_follow_up: >-
      Worth telling the provider. Companies usually do not know that a
      swagger-node /api-docs route is exposed on their production API host, and
      this one leaks internal handler filenames and an admin-role vocabulary.
  - title: Provider-published personal contact in the Reporting API spec
    detail: >-
      openapi/_original/mavrck-reporting-api.json and the five refined documents
      derived from it carry an `info.contact.email` naming an individual at Later.
      It is the provider's own published business contact in their own public
      SwaggerHub document and was saved verbatim for provenance; it has NOT been
      propagated into any derived artifact, maintainer record or apis.yml pointer —
      those cite the help-centre URL instead. Flagging it so a human can decide
      whether the verbatim copies should be redacted before publication.
  - title: Expired apex certificate
    detail: >-
      https://mavrck.co/ presents an expired certificate. Only www.mavrck.co
      (Google Trust Services, expires 2026-09-15) and api.mavrck.co (Amazon,
      expires 2026-12-25) are currently valid. The apis.yml Website pointer was
      moved to the www host for that reason.
  - title: Announced deprecation with no machine-readable signal
    detail: >-
      The provider's help centre states the v1 Reporting API "will be deprecated
      within the next 6 months" (article last updated 2026-04-15) in favour of
      https://reporting.api.later.com, with no firm date. No Sunset or Deprecation
      header is emitted on any live response and only 1 of 687 platform operations
      carries `deprecated: true`. A running integration receives no warning.
