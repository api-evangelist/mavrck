support:
  self_serve: false
  note: >-
    Both API surfaces are gated on a human. The help centre directs customers to
    their Account Manager / Customer Success Manager to obtain platform API keys
    and Reporting API client credentials; there is no signup, sandbox or key
    self-service page.
