              schema:
                $ref: '#/components/schemas/ForbiddenError'
        '404':
          description: The resource does not exist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
        '500':
          description: Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerError'
      description: Reads the stored brand context record from DynamoDB. *
      tags:
      - BrandSuitabilityHarness
      parameters:
      - in: query
        name: communityId
        required: false
        schema:
          type: string
    patch:
      operationId: harnessUpdateBrandContext
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HarnessResponse_any.any_'
        '400':
          description: Missing Parameter
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidateErrorJSON'
        '403':
          description: Access forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenError'
        '404':
          description: The resource does not exist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
        '500':
          description: Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerError'
      description: Partial-updates the stored brand context fields. *
      tags:
      - BrandSuitabilityHarness
      parameters:
      - in: query
        name: communityId
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateBrandContextRequest'
        required: true
    delete:
      operationId: harnessDeleteBrandContext
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HarnessResponse_any.any_'
        '400':
          description: Missing Parameter
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidateErrorJSON'
        '403':
          description: Access forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenError'
        '404':
          description: The resource does not exist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
        '500':
          description: Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerError'
      description: Deletes the stored brand context record. *
      tags:
      - BrandSuitabilityHarness
      parameters:
      - in: query
        name: communityId
        required: false
        schema:
          type: string
  /v1/brand-suitability/harness/campaigns/{campaignId}/campaign-context:
    get:
      operationId: harnessCampaignContext
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HarnessResponse_any.any_'
        '400':
          description: Missing Parameter
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidateErrorJSON'
        '403':
          description: Access forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenError'
        '404':
          description: The resource does not exist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
        '500':
          description: Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerError'
      tags:
      - BrandSuitabilityHarness
      parameters:
      - in: path
        name: campaignId
        required: true
        schema:
          type: number
          format: double
  /v1/brand-suitability/harness/research:
    post:
      operationId: harnessResearch
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HarnessResponse_any.any_'
        '400':
          description: Missing Parameter
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidateErrorJSON'
        '403':
          description: Access forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenError'
        '404':
          description: The resource does not exist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
        '500':
          description: Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerError'
      description: 'Runs the research pipeline: discovery (search) + enrichment (visit each URL for full page content).

        Provide creatorContext directly (e.g. from prod) to skip the buildCreatorContext step,

        or provide globalUserId to build it from local data. One of the two is required.'
      tags:
      - BrandSuitabilityHarness
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResearchRequest'
        required: true
  /v1/brand-suitability/harness/verify-sources:
    post:
      operationId: harnessVerifySources
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HarnessResponse_any.any_'
        '400':
          description: Missing Parameter
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidateErrorJSON'
        '403':
          description: Access forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenError'
        '404':
          description: The resource does not exist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
        '500':
          description: Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerError'
      description: 'Runs source verification against user-provided sources without running discovery.

        Provide creatorContext directly (e.g. from prod) to skip the buildCreatorContext step,

        or provide globalUserId to build it from local data. One of the two is required.'
      tags:
      - BrandSuitabilityHarness
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifySourcesRequest'
        required: true
  /v1/brand-suitability/harness/global-users/{globalUserId}/reverify:
    post:
      operationId: harnessReverify
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HarnessResponse_any.any_'
        '400':
          description: Missing Parameter
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidateErrorJSON'
        '403':
          description: Access forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenError'
        '404':
          description: The resource does not exist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
        '500':
          description: Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerError'
      description: 'Re-runs verification on existing research from DynamoDB. Skips discovery.

        Loads stored findings and runs pre-filter + LLM verification.

        Provide creatorContext to skip buildCreatorContext, or omit to build from local data.'
      tags:
      - BrandSuitabilityHarness
      parameters:
      - in: path
        name: globalUserId
        required: true
        schema:
          type: number
          format: double
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReverifyRequest'
        required: true
  /v1/brand-suitability/harness/assess:
    post:
      operationId: harnessAssessMetric
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HarnessResponse_any.any_'
        '400':
          description: Missing Parameter
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidateErrorJSON'
        '403':
          description: Access forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenError'
        '404':
          description: The resource does not exist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
        '500':
          description: Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerError'
      tags:
      - BrandSuitabilityHarness
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssessMetricRequest'
        required: true
  /v1/brand-suitability/harness/assess-full:
    post:
      operationId: harnessAssessFull
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HarnessResponse_any.any_'
        '400':
          description: Missing Parameter
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidateErrorJSON'
        '403':
          description: Access forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenError'
        '404':
          description: The resource does not exist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
        '500':
          description: Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerError'
      description: 'Runs the full assessment pipeline (exec) on stored or inline findings without persisting the report.

        Builds missing contexts from local data; inline overrides take precedence. One of creatorContext or globalUserId required.'
      tags:
      - BrandSuitabilityHarness
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssessFullRequest'
        required: true
components:
  schemas:
    MetricRelevanceWeights:
      $ref: '#/components/schemas/Record_AssessmentMetricsEnum.MetricWeight_'
    Record_AssessmentMetricsEnum.MetricWeight_:
      properties:
        brandAuthenticity:
          $ref: '#/components/schemas/MetricWeight'
        controversyScandals:
          $ref: '#/components/schemas/MetricWeight'
        adultContent:
          $ref: '#/components/schemas/MetricWeight'
        vulgarityProfanity:
          $ref: '#/components/schemas/MetricWeight'
        brandConflicts:
          $ref: '#/components/schemas/MetricWeight'
        politicalContent:
          $ref: '#/components/schemas/MetricWeight'
        socialClimate:
          $ref: '#/components/schemas/MetricWeight'
        misinformation:
          $ref: '#/components/schemas/MetricWeight'
        hateSpeech:
          $ref: '#/components/schemas/MetricWeight'
        violenceContent:
          $ref: '#/components/schemas/MetricWeight'
        substanceAbuse:
          $ref: '#/components/schemas/MetricWeight'
        competitorConflicts:
          $ref: '#/components/schemas/MetricWeight'
      type: object
      description: Construct a type with a set of properties K of type T
    KnownSocialNetworkDTO:
      properties:
        platform:
          type: string
        handle:
          type: string
        url:
          type:
          - string
          - 'null'
        description:
          type:
          - string
          - 'null'
      required:
      - platform
      - handle
      - url
      - description
      type: object
      additionalProperties: false
    AssessFullRequest:
      properties:
        globalUserId:
          type: number
          format: double
        communityId:
          type: string
        campaignId:
          type: number
          format: double
        creatorContext:
          additionalProperties: false
          type: object
        brandContext:
          additionalProperties: false
          type: object
        campaignContext:
          additionalProperties: false
          type: object
        findings:
          items:
            $ref: '#/components/schemas/StoredFinding'
          type: array
      type: object
      additionalProperties: false
    AssessMetricRequest:
      properties:
        metric:
          type: string
        globalUserId:
          type: number
          format: double
        creatorContext:
          additionalProperties: false
          type: object
        findings:
          items:
            $ref: '#/components/schemas/StoredFinding'
          type: array
      required:
      - metric
      type: object
      additionalProperties: false
    ReverifyRequest:
      properties:
        creatorContext:
          additionalProperties: false
          type: object
      type: object
      additionalProperties: false
    MetricWeight:
      properties:
        weight:
          type: number
          format: double
        reason:
          type: string
      required:
      - weight
      - reason
      type: object
      additionalProperties: false
    SaveCreatorContextRequest:
      properties:
        input:
          $ref: '#/components/schemas/PartialCreatorProfile'
        output:
          $ref: '#/components/schemas/CreatorContextDTO'
      type: object
      additionalProperties: false
    NotFoundError:
      properties:
        message:
          type: string
          enum:
          - Resource Not Found
        details:
          properties: {}
          additionalProperties:
            additionalProperties: true
          type: object
      required:
      - message
      - details
      type: object
      additionalProperties: false
    VerifySourcesRequest:
      properties:
        globalUserId:
          type: number
          format: double
        creatorContext:
          additionalProperties: false
          type: object
        sources:
          items:
            properties:
              credibility:
                type: string
                enum:
                - high
                - medium
                - low
              sentiment:
                type: string
                enum:
                - negative
                - neutral
                - positive
              sourceDate:
                type:
                - string
                - 'null'
              keyQuotes:
                items:
                  type: string
                type: array
              detailedSummary:
                type: string
              url:
                type: string
            required:
            - url
            type: object
          type: array
      required:
      - sources
      type: object
      additionalProperties: false
    HarnessResponse_any.any_:
      properties:
        input:
          additionalProperties: true
        output:
          additionalProperties: true
      required:
      - input
      - output
      type: object
      additionalProperties: false
    ResearchRequest:
      properties:
        globalUserId:
          type: number
          format: double
        creatorContext:
          additionalProperties: false
          type: object
      type: object
      additionalProperties: false
    DataScoreLevelDTO:
      description: 'Brand Suitability LLM/assessment output DTOs.

        `v0.3 UI:` notes track field consumption by the v0.3 report view. "unused" = not read by v0.3 (may be used by legacy/admin). Audited 2026-06-22.'
      enum:
      - HIGH
      - MEDIUM
      - LOW
      - NONE
      type: string
    ForbiddenError:
      properties:
        message:
          type: string
          enum:
          - Access Forbidden
        details:
          properties: {}
          additionalProperties:
            additionalProperties: true
          type: object
      required:
      - message
      - details
      type: object
      additionalProperties: false
    SaveBrandContextRequest:
      properties:
        input:
          $ref: '#/components/schemas/Record_string.unknown_'
        output:
          $ref: '#/components/schemas/BrandContextDTO'
      type: object
      additionalProperties: false
    ServerError:
      properties:
        message:
          type: string
          enum:
          - Server Error
        details:
          properties: {}
          additionalProperties:
            additionalProperties: true
          type: object
      required:
      - message
      - details
      type: object
      additionalProperties: false
    SocialProfileInfo:
      properties:
        username:
          type:
          - string
          - 'null'
        displayName:
          type:
          - string
          - 'null'
        url:
          type:
          - string
          - 'null'
        bio:
          type:
          - string
          - 'null'
        followersCount:
          type:
          - number
          - 'null'
          format: double
        engagementRate:
          type:
          - number
          - 'null'
          format: double
        followingCount:
          type:
          - number
          - 'null'
          format: double
        mediaCount:
          type:
          - number
          - 'null'
          format: double
        insights:
          $ref: '#/components/schemas/SocialProfileInsights'
      required:
      - username
      - displayName
      - url
      - bio
      type: object
      additionalProperties: false
    Record_string.unknown_:
      properties: {}
      type: object
      description: Construct a type with a set of properties K of type T
    UpdateBrandContextRequest:
