          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerError'
      description: Builds a structured creator profile from platform data (social handles, bio, location, etc.) *
      tags:
      - BrandSuitabilityHarness
      parameters:
      - in: path
        name: globalUserId
        required: true
        schema:
          type: number
          format: double
    post:
