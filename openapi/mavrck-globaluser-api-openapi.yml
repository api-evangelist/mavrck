        '404':
          description: The resource does not exist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
        '500':
          description: Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerError'
      tags:
      - GlobalUser
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: number
          format: double
      - in: query
        name: index
        required: false
        schema:
          type: string
          enum:
          - user_index
          - members_index
      - in: query
        name: isPublic
        required: false
        schema:
          type: boolean
    put:
      operationId: updateGlobalUserSummary
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TSOAEmptyObject'
        '400':
          description: Validation Failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestError'
        '403':
          description: Access forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenError'
        '500':
          description: Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerError'
      description: Update an Influencer Index creator's contact info.
      tags:
      - GlobalUser
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: number
          format: double
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateGlobalUserBodyDefinition'
        required: true
  /v1/global-users:
    get:
