openapi: 3.2.0
info:
  version: 1.0.0
  description: Identify your most influential customers and activate them to drive more conversions on social.
  title: MAVRCK.IO Global User Lists API
servers:
- url: http://app.splashscore.com/v1
- url: https://app.splashscore.com/v1
security:
- apiKey: []
tags:
- name: GlobalUserLists
paths:
  /action-groups/{id}/candidates/global-user-lists/{globalUserListId}/members:
    post:
      tags:
      - GlobalUserLists
      operationId: createGlobalUserListMemberFromCandidates
      x-handler: global_user_lists/global_user_list_member_controller.js
      x-access:
      - administrator
      summary: Add candidates of an action group to a global user list.
      parameters:
      - name: id
        in: path
        required: true
        description: Unique identifier of the action group that influencers are candidates of.
        schema:
          type: string
      - name: globalUserListId
        in: path
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: Members added successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyObject'
        '400':
          description: Missing or invalid parameter.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Session expired.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Access forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Global user list not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                globalUserIds:
                  type: array
                  items:
                    type: integer
                queryFilter:
                  $ref: '#/components/schemas/ActionGroupCandidateQueryFilter'
        required: true
    put:
      tags:
      - GlobalUserLists
      operationId: moveGlobalUserListMemberFromCandidates
      x-handler: global_user_lists/global_user_list_member_controller.js
      x-access:
      - administrator
      summary: Move candidates of an action group from one global user list to another.
      parameters:
      - name: id
        in: path
        required: true
        description: Unique identifier of the action group that influencers are candidates of.
        schema:
          type: string
      - name: globalUserListId
        in: path
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: Members moved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyObject'
        '400':
          description: Missing or invalid parameter.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Session expired.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Access forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Global user list not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - fromGlobalUserListIds
              properties:
                fromGlobalUserListIds:
                  type: array
                  items:
                    type: integer
                globalUserIds:
                  type: array
                  items:
                    type: integer
                queryFilter:
                  $ref: '#/components/schemas/ActionGroupCandidateQueryFilter'
        required: true
  /action-groups/{id}/candidates/global-user-lists/members/remove:
