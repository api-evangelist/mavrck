openapi: 3.2.0
info:
  version: 1.0.0
  description: Identify your most influential customers and activate them to drive more conversions on social.
  title: MAVRCK.IO Reward Wins API
servers:
- url: http://app.splashscore.com/v1
- url: https://app.splashscore.com/v1
security:
- apiKey: []
tags:
- name: RewardWins
paths:
  /influencers/{influencerId}/reward-wins:
    get:
      x-handler: reward_wins/influencer_reward_wins_controller.js
      x-access:
      - administrator
      - root
      tags:
      - RewardWins
      summary: Retrieve all reward wins for an influencer.
      operationId: getAllInfluencerRewardWins
      parameters:
      - name: influencerId
        in: path
        required: true
        schema:
          type: integer
      - name: isFulfilled
        in: query
        required: false
        schema:
          type: boolean
      - $ref: '#/components/parameters/orderByParam'
      - $ref: '#/components/parameters/limitParam'
      - $ref: '#/components/parameters/offsetParam'
      responses:
        '200':
          description: An array of reward wins.
          content:
            application/json:
              schema:
                type: object
                properties:
                  meta:
                    $ref: '#/components/schemas/ResponseMetadata'
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/RewardWin'
        '401':
          description: Session expired.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: API Key invalid or access denied.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/reward-wins/fulfill-objects/bulk:
    put:
      operationId: bulkFulfillRewardWinsObjects
      responses:
        '200':
          description: OK
          content:
            application/json:
