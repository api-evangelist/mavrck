  parameters:
    channel:
      in: query
      description: Allows the client to indicate their channel, in order to filter irrelevant resources.
      name: channel
      schema:
        type: string
    OutboundMessage:
      name: data
      in: body
      required: true
      schema:
        type: object
        required:
        - html
        - subject
        - recipients
        properties:
          recipients:
            type: array
            items:
              $ref: '#/components/schemas/MessageRecipient'
          attachments:
            type: array
            items:
              $ref: '#/components/schemas/Attachment'
          templates:
            type: array
            items:
              $ref: '#/components/schemas/ConversationTemplateDeprecated'
          subject:
            type: string
          html:
            type: string
    limitParam:
      in: query
      description: Maximum number of items to return
      name: limit
      schema:
        type: integer
    offsetParam:
      in: query
      description: Number of items to skip
      name: offset
      schema:
        type: integer
    orderDirection:
      in: query
      description: Select the direction by which the data will be ordered, ascending or descending.
      name: orderDirection
      schema:
        type: string
        enum:
        - ASC
        - DESC
  securitySchemes:
    apiKey:
      type: apiKey
      name: api-key
      in: header
