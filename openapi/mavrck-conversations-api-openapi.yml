      tags:
      - Conversations
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConversationBulkActionRequestBody'
        required: true
  /v1/inline-images:
    post:
      operationId: uploadInlineImage
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadInlineImageResult'
        '400':
          description: Invalid Parameter.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidateErrorJSON'
        '403':
          description: Access forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenError'
        '500':
          description: Server Error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerError'
      tags:
      - Conversations
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
              required:
              - file
  /v1/messages/{messageId}/events:
    get:
      operationId: getMessageEvents
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueryByMessageResult'
        '400':
          description: Missing Parameter
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidateErrorJSON'
        '403':
          description: Access forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenError'
        '404':
          description: The resource does not exist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
        '500':
          description: Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerError'
      tags:
      - Conversations
      parameters:
      - in: path
        name: messageId
        required: true
        schema:
          type: number
          format: double
      - in: query
        name: limit
        required: false
        schema:
          type: number
          format: double
      - in: query
        name: offset
        required: false
        schema:
          type: number
          format: double
      - in: query
        name: orderDirection
        required: false
        schema:
          type: string
          enum:
          - DESC
          - ASC
      - in: query
        name: orderProperty
        required: false
        schema:
          type: string
          enum:
          - occurredAt
      - in: query
        name: event
        required: false
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
components:
  schemas:
    Error:
      type: object
      properties:
        type:
          type: string
          description: A key representing the type of error that has occurred.
        error:
          type: string
          description: A static description of the type of error.
        params:
          type: array
          description: For errors invovling parameters, this is an array containing the invalid parameters.
          items:
            type: string
        keys:
          type: array
          items:
            type:
            - string
            - object
        artifactLinks:
          $ref: '#/components/schemas/LinksDeprecated'
        parent:
          type: object
          properties:
            type:
              type: string
              description: A key representing the type of error generated by a request to an external API.
            error:
              type: string
              description: A static description of the parent error.
    UploadInlineImageResult:
      properties:
        link:
          type: string
      required:
      - link
      type: object
      additionalProperties: false
    GeneralFolders:
      type: object
      properties:
        inbox:
          type: integer
        generalInquiries:
          type: integer
        draft:
          type: integer
        sent:
          type: integer
        archived:
          type: integer
    WorkflowStatusRequirementDeprecated:
      type: object
      properties:
        satisfied:
          type: boolean
        incentiveId:
          type: number
        name:
          type: string
    MessageRecipient:
      type: object
      properties:
        displayName:
          type:
          - string
          - 'null'
        email:
          type: string
        emailId:
          type: integer
        role:
          type: string
          enum:
          - from
          - to
          - cc
    NotFoundError:
      properties:
        message:
          type: string
          enum:
          - Resource Not Found
        details:
          properties: {}
          additionalProperties:
            additionalProperties: true
          type: object
      required:
      - message
      - details
      type: object
      additionalProperties: false
    ConversationBulkActionRequestBody:
      properties:
        conversationIds:
          items:
            type: number
            format: double
          type: array
        search:
          type: string
      type: object
      additionalProperties: false
    Attachment:
      type: object
      properties:
        originalName:
          type: string
        encoding:
          type: string
        buffer:
          type: string
        mimeType:
          type: string
        disposition:
          type: string
        size:
          type: integer
        uri:
          type: string
        contentId:
          type: string
    Message:
      type: object
      properties:
        id:
          type: integer
        subject:
          type: string
        messageIdHeader:
          type: string
        conversationId:
          type: string
        scheduledFor:
          type: string
          format: date-time
        scheduledMessage:
          type: object
          properties:
            id:
              type: integer
            createdAt:
              type: string
              format: date-time
            messageId:
              type: integer
