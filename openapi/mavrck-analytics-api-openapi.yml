          type: object
      required:
      - message
      - details
      type: object
      additionalProperties: false
    TopPerformer:
      properties:
        globalUserId:
          type: number
          format: double
        profilePictureUrl:
          type: string
        fullName:
          type: string
        profiles:
          items:
            $ref: '#/components/schemas/CreatorProfile'
          type: array
      required:
      - globalUserId
      - profilePictureUrl
