      - Analytics
      parameters:
      - in: query
        name: rewardWinIds
        required: false
        style: form
        explode: true
        schema:
          type: array
          items:
            type: number
            format: double
      - in: query
        name: listMemberIds
        required: false
        style: form
        explode: true
        schema:
          type: array
          items:
            type: number
            format: double
      - in: query
        name: actionGroupId
        required: false
        schema:
          type: number
          format: double
      - in: query
        name: globalUserId
        required: false
        schema:
          type: number
          format: double
  /v1/reporting-details/campaign-details:
    get:
      operationId: GetEnrichCampaignsData
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
