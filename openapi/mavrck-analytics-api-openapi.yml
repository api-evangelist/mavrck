components:
  schemas:
    ActivationContentNetwork:
      type: string
      enum:
      - blog
      - facebook
      - facebook_live
      - facebook_reel
      - facebook_group
      - image
      - instagram
      - instagram_reel
      - instagram_story
      - linkedin
      - musical_ly
      - pinterest
      - snapchat_story
      - tiktok
      - twitch_stream
      - twitter
      - youtube_video
      - youtube_shorts
      - video
    EnrichedCampaignData:
      properties:
        instanceId:
          type: string
        status:
          type: string
        internalDescription:
          type: string
        contentDueDate:
          type: string
          format: date-time
        description:
          type: string
        title:
          type: string
        endDate:
          type: string
          format: date-time
        startDate:
          type: string
          format: date-time
        campaignId:
          type: number
          format: double
      required:
      - campaignId
      type: object
    InfluencerIncentiveDetailsResponse:
      type: object
      properties: {}
    EnrichedCreatorsResponse:
      properties:
        data:
          items:
            $ref: '#/components/schemas/TopPerformer'
          type: array
      required:
      - data
      type: object
      additionalProperties: false
    CreatorProfile:
      properties:
        network:
          type: string
        handleName:
          type: string
        profileLink:
          type: string
        profileImage:
          type: string
        fullName:
          type: string
      required:
      - network
      - handleName
      - profileLink
      - profileImage
      type: object
      additionalProperties: false
    NotFoundError:
      properties:
        message:
          type: string
          enum:
          - Resource Not Found
        details:
          properties: {}
          additionalProperties:
            additionalProperties: true
          type: object
      required:
      - message
      - details
      type: object
      additionalProperties: false
    ContentInfo:
      properties:
        dateCreated:
          type: number
          format: double
        urlCanonical:
          type: string
        url:
          type: string
        text:
          type: string
        media:
          $ref: '#/components/schemas/ContentMedia'
        engagements:
          $ref: '#/components/schemas/ContentEngagements'
        status:
          type: string
          enum:
          - DRAFT
          - PUBLISHED
        type:
          type: string
        profile:
          type: object
        externalId:
          $ref: '#/components/schemas/ContentExternalIdentity'
      required:
      - media
      - type
      - profile
      type: object
    EnrichedCampaignsResponse:
      properties:
        data:
          items:
            $ref: '#/components/schemas/EnrichedCampaignData'
          type: array
      required:
      - data
      type: object
      additionalProperties: false
    EnrichedContentResponse:
      properties:
        data:
          items:
            $ref: '#/components/schemas/EnrichedContentData'
          type: array
      required:
      - data
      type: object
      additionalProperties: false
    ContentMediaSize:
      properties:
        unit:
          type: string
          enum:
          - CENTIMETERS
          - MILLIMETERS
          - INCHES
          - PIXELS
          - PERCENT
          - POINTS
        height:
          type: number
          format: double
        width:
          type: number
          format: double
      required:
      - unit
      type: object
    EnrichedContentData:
      properties:
        network:
          $ref: '#/components/schemas/ActivationContentNetwork'
        content:
          $ref: '#/components/schemas/ContentInfo'
        activationId:
          type: number
          format: double
        globalUserId:
          type: number
          format: double
      required:
      - network
      - content
      - activationId
      - globalUserId
      type: object
    ForbiddenError:
      properties:
        message:
          type: string
          enum:
          - Access Forbidden
        details:
          properties: {}
          additionalProperties:
