openapi: 3.2.0
info:
  title: Later Influence™ Social Network Level API
  description: '# Description

    The Reporting API enables deep analysis and reporting of marketing campaigns, social media performance, and influencer effectiveness.

    It provides comprehensive performance insights at multiple levels:

    - Instance Level: Get instance details, overall performance, and performance over time

    - Campaign Level: Retrieve detailed campaign performance metrics

    - Social Network Level: Analyze performance across different social networks and calculate return on investment

    - Influencer Level: Evaluate individual influencer performance

    - Post Level: Access granular performance data for individual posts


    # Authentication

    In order to use the Reporting API, OAuth2 authentication is required. The API uses the client credentials flow for authentication. To obtain an access token:


    1. Request the client credentials (client ID and client secret) from the support team.

    2. Make a POST request to the token endpoint: `https://api.mavrck.co/oauth/token`, including your client credentials in the request body.


    Curl Example:

    ```

    curl --request POST \

    --url ''https://api.mavrck.co/oauth/token'' \

    --header ''Content-Type: application/json'' \

    --header ''accept: application/json'' \

    --data ''{

    "clientId": "",

    "clientSecret": ""

    }''

    ```


    3. Include the obtained access token in the Authorization header of your API requests:


    Curl Example:

    ```

    curl --request GET \

    --url ''https://api.mavrck.co/v1/reporting/instance/details'' \

    --header ''Content-Type: application/json'' \

    --header ''accept: application/json'' \

    --header ''Authorization: Bearer ****'' \

    ```


    For security reasons, access tokens have a limited lifespan of 12 hours. You should implement a mechanism to refresh the token when it expires.


    # Data Availability

    - Most endpoints return analytics that are current up to the previous day, as several social media platforms apply a 24-hour reporting delay.

    - Data access is limited to the specific account or instances associated with the provided API credentials.

    - Analytics are recorded on a daily basis and appear only when they fall within the selected date-range filters. For example, if a post was published a week ago but receives its first interaction today, that interaction will only be included when today’s date is part of the chosen range.


    # Base Filters

    All endpoints support the following filters:

    - `startDate` (ISO 8601 format, e.g. 2024-01-01)

    - `endDate` (ISO 8601 format, e.g. 2024-01-01). There is a limit of up to 2 years for the selected date range.

    - `instanceIds` array of instance ids. If not provided, all instances associated with the API credentials will be considered.

    - `campaignIds` array of campaign ids, if no campaign ids are provided, all campaigns for the instance will be used

    - `reportingGroupIds` array of reporting group ids, if no reporting group ids are provided, all reporting groups for the instance will be used


    # Pagination

    - The pagination is available for endpoints returning large datasets.

    - Use `pageSize` and `pageNumber` query parameters to control the results. For the `pageSize` parameter, the default is 50 and the maximum is 100.


    # Versioning

    - API versioning supported through URI path


    # Changelog


    ---


    ## 2025-11-25 Introduce Multi-instance support

    ### Added

    - `GET /instances` API - Retrieve the list of instances accessible by the provided API credentials.

    - `GET /instances/details` API - Get detailed information about the instances associated with the provided API credentials such as `influencersCount`, `campaignsCount`, and other relevant metrics. It is similar to the existing `GET /instance/details` endpoint but supports multiple instances.


    ### Changed

    - All endpoints now support an `instanceIds` query parameter, allowing you to filter results by specific instance IDs when your credentials have access to multiple instances.

    - `GET /campaigns/performance` response includes a new string field `instanceId`.

    - `GET /post/performance` response includes a new string field `instanceId`.'
  version: 1.2.1
  contact:
    name: Developer
    url: https://help-influence.later.com/hc/en-us
    email: urvash.chheda@later.com
  termsOfService: https://later.com/terms/
servers:
- url: https://api.mavrck.co
security:
- JWT: []
tags:
- name: Social Network Level
paths:
  /v1/reporting/network/performance:
    get:
      description: Get social networks performance details.
      operationId: getNetworkPerformance
      parameters:
      - name: startDate
        required: true
        in: query
        description: Start date for the report, YYYY-MM-dd format
        schema:
          format: date-time
          type: string
      - name: endDate
        required: true
        in: query
        description: End date for the report, YYYY-MM-dd format
        schema:
          format: date-time
          type: string
      - name: instanceIds
        required: false
        in: query
        description: A list of instance ids. If not provided, all instances associated with the API credentials will be considered.
        schema:
          type: array
          items:
            type: string
      - name: campaignIds
        required: false
        in: query
        description: A list of campaign ids (max 50 items)
        schema:
          type: array
          items:
            type: number
      - name: reportingGroupIds
        required: false
        in: query
        description: A list of reporting group ids
        schema:
          type: array
          items:
            type: string
      - name: pageSize
        required: false
        in: query
        description: Number of items per page
        schema:
          default: 50
          type: number
      - name: pageNumber
        required: false
        in: query
        description: The page you would like to get data for
        schema:
          default: 1
          type: number
      - name: sortProperty
        required: false
        in: query
        description: 'sortProperty must be one of the following values: engagements, impressions, engagementRate, impressionsPerPosts, engagementsPerPosts, postsCount'
        schema:
          type: string
      - name: sortDirection
        required: false
        in: query
        description: ASC or DESC
        schema:
          default: DESC
          type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ReportingApiResponseDto'
                - properties:
                    data:
                      type: array
                      items:
                        $ref: '#/components/schemas/NetworkPerformanceResponseDto'
      summary: Get network performance
      tags:
      - Social Network Level
      x-summary-source: derived
  /v1/reporting/network/return-on-investment:
    get:
      description: Get social networks return on investment details.
      operationId: findReturnOfInvestments
      parameters:
      - name: startDate
        required: true
        in: query
        description: Start date for the report, YYYY-MM-dd format
        schema:
          format: date-time
          type: string
      - name: endDate
        required: true
        in: query
        description: End date for the report, YYYY-MM-dd format
        schema:
          format: date-time
          type: string
      - name: instanceIds
        required: false
        in: query
        description: A list of instance ids. If not provided, all instances associated with the API credentials will be considered.
        schema:
          type: array
          items:
            type: string
      - name: campaignIds
        required: false
        in: query
        description: A list of campaign ids (max 50 items)
        schema:
          type: array
          items:
            type: number
      - name: reportingGroupIds
        required: false
        in: query
        description: A list of reporting group ids
        schema:
          type: array
          items:
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ReportingApiResponseDto'
                - properties:
                    data:
                      type: array
                      items:
                        $ref: '#/components/schemas/NetworkReturnOnInvestmentResponseDto'
                    meta:
                      example: null
      summary: Find return of investments
      tags:
      - Social Network Level
      x-summary-source: derived
components:
  schemas:
    ReportingApiResponseDto:
      type: object
      properties:
        data:
          type: object
          additionalProperties: false
        meta:
          type:
          - object
          - 'null'
          description: Metadata containing page information
          properties:
            page:
              type: number
              example: 1
            totalPages:
              type: number
              example: 10
      required:
      - data
      - meta
    NetworkReturnOnInvestmentResponseDto:
      type: object
      properties:
        socialNetwork:
          type: string
          enum:
          - blog
          - facebook
          - facebook_live
          - facebook_group
          - facebook_reel
          - image
          - instagram
          - instagram_reel
          - instagram_story
          - linkedin
          - musical_ly
          - pinterest
          - snapchat_story
          - tiktok
          - twitch_stream
          - twitter
          - youtube_video
          - youtube_shorts
          - video
          description: Name of the social network
          example: instagram
        valueOfShares:
          type:
          - number
          - 'null'
          example: 1000
          description: Value generated from shares
        valueOfImpressions:
          type:
          - number
          - 'null'
          example: 1500
          description: Value generated from impressions
        valueOfComments:
          type:
          - number
          - 'null'
          example: 800
          description: Value generated from comments
        valueOfLikes:
          type:
          - number
          - 'null'
          example: 700
          description: Value generated from likes
        valueGenerated:
          type:
          - number
          - 'null'
          example: 5000
          description: Total value generated
        estimatedContentCost:
          type:
          - number
          - 'null'
          example: 2000
          description: Is calculated based on how many posts received metrics in the selected time range for a specific network vs the amount of money paid to the author(influencer)
        returnOnInvestment:
          type:
          - number
          - 'null'
          example: 2.5
          description: Return on investment as a ratio
      required:
      - valueOfShares
      - valueOfImpressions
      - valueOfComments
      - valueOfLikes
      - valueGenerated
      - estimatedContentCost
      - returnOnInvestment
    NetworkPerformanceResponseDto:
      type: object
      properties:
        socialNetwork:
          type: string
          example: Instagram
          enum:
          - blog
          - facebook
          - facebook_live
          - facebook_group
          - facebook_reel
          - image
          - instagram
          - instagram_reel
          - instagram_story
          - linkedin
          - musical_ly
          - pinterest
          - snapchat_story
          - tiktok
          - twitch_stream
          - twitter
          - youtube_video
          - youtube_shorts
          - video
          description: Name of the social network
        postsCount:
          type:
          - number
          - 'null'
          example: 100
          description: Total number of posts
        impressions:
          type:
          - number
          - 'null'
          example: 10000
          description: Total number of impressions
        impressionsPerPosts:
          type:
          - number
          - 'null'
          example: 100
          description: ' Average impressions per post'
        engagements:
          type:
          - number
          - 'null'
          example: 500
          description: Total number of engagements
        engagementsPerPosts:
          type:
          - number
          - 'null'
          example: 5
          description: Average engagements per post
        engagementRate:
          type:
          - number
          - 'null'
          example: 0.05
          description: Engagement rate as a decimal
      required:
      - socialNetwork
      - postsCount
      - impressions
      - impressionsPerPosts
      - engagements
      - engagementsPerPosts
      - engagementRate
  securitySchemes:
    JWT:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT obtained from the OAuth2 token endpoint
