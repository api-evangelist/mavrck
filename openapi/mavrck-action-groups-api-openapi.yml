          format: double
        rewards:
          type: number
          format: double
        posts:
          type: number
          format: double
        listMemberId:
          type: number
          format: double
        impressions:
          type: number
          format: double
        engagements:
          type: number
          format: double
        cost:
          type: number
          format: double
        conversionValue:
          type: number
          format: double
        conversions:
          type: number
          format: double
        clicks:
          type: number
          format: double
      required:
      - value
      - rewards
      - posts
      - listMemberId
      - impressions
      - engagements
      - cost
      - conversionValue
      - conversions
      - clicks
      type: object
    ActionGroupParticipantInstagramPostDto:
      properties:
        link:
          type: string
        imageUrl:
          type: string
      required:
      - link
      - imageUrl
      type: object
  securitySchemes:
    apiKey:
      type: apiKey
      name: api-key
      in: header
