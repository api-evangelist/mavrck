openapi: 3.2.0
info:
  version: 1.0.0
  description: Identify your most influential customers and activate them to drive more conversions on social.
  title: MAVRCK.IO Workflow API
servers:
- url: http://app.splashscore.com/v1
- url: https://app.splashscore.com/v1
security:
- apiKey: []
tags:
- name: Workflow
paths:
  /workflow/{actionGroupId}/workflow-performance-forecast:
    get:
      tags:
      - Workflow
      operationId: getWorkflowActionGroupPerformanceForecast
      x-handler: workflow/workflow_action_group_forecast_controller.js
      x-access:
      - administrator
      - root
      summary: Retrieve performance forecast for an action group.
      parameters:
      - name: actionGroupId
        in: path
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: Workflow Performance forecast.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      candidates:
                        $ref: '#/components/schemas/WorkflowActionGroupPerformanceForecast'
                      participants:
                        $ref: '#/components/schemas/WorkflowActionGroupPerformanceForecast'
                      complete:
                        $ref: '#/components/schemas/WorkflowActionGroupPerformanceForecast'
                      forecast:
                        $ref: '#/components/schemas/WorkflowActionGroupPerformanceForecast'
        '400':
          description: Invalid or missing parameter.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Session expired.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Access forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Global user or resource not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /workflow/promote-initial:
    post:
      x-handler: workflow/workflow_controller.js
      summary: Promote global userIds to list members and set their status to the initial workflow stage
      x-access:
      - administrator
      operationId: promoteToInitialWorkflowStage
      tags:
      - Workflow
      responses:
        '200':
          description: Initial workflow stage with Conversation Templates
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyObject'
        '400':
          description: Invalid parameter.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Session expired.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Invalid API Key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Action group not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                globalUserIds:
                  type: array
                  items:
                    type:
                    - string
                    - integer
                actionGroupId:
                  type: integer
                  description: Unique identifier of the actionGroup
                fromActionGroupId:
                  type: integer
                  description: Unique identifier of the actionGroup which you are promoting from.
                queryFilter:
                  type: object
                  description: Filter for the query.
                searchState:
                  type: object
                  description: Capture Search State for analytics
                useSearchWithOpenAI:
                  type: boolean
                  description: Flag to detect if search was done with OpenAI
                openAISearchResults:
                  type: string
                  description: OpenAI Search Results JSON
        required: true
  /workflow/{listMemberId}/promote:
    put:
      x-handler: workflow/workflow_controller.js
      summary: Promote a List Member to their next status.
      x-access:
      - administrator
      operationId: promoteListMember
      tags:
      - Workflow
      parameters:
      - name: listMemberId
        in: path
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: Successfully added globalUserIds to list and moved to first workflow stage
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyObject'
        '400':
          description: Invalid parameter.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Session expired.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Invalid API Key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Action group not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '412':
          description: Invalid custom status id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                currentCustomStatusId:
                  type: integer
  /workflow/{activityId}/get-initial-status-automation-rules:
    get:
      x-handler: workflow/workflow_controller.js
      summary: Get intial workflow status with automation rules
      x-access:
      - administrator
      operationId: getInitialWorkflowStatusAutomationRules
      tags:
      - Workflow
      parameters:
      - name: activityId
        in: path
        required: true
        schema:
          type: integer
      - name: expectedNumberOfInfluencers
        in: query
        required: false
        schema:
          type: integer
      responses:
        '200':
          description: Initial workflow status with automation rules
          content:
            application/json:
              schema:
                type: object
                items:
                  $ref: '#/components/schemas/ListCustomStatusDeprecated'
        '400':
          description: Invalid parameter.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Session expired.
          content:
            application/json:
              schema:
