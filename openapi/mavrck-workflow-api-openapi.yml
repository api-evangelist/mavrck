components:
  schemas:
    Error:
      type: object
      properties:
        type:
          type: string
          description: A key representing the type of error that has occurred.
        error:
          type: string
          description: A static description of the type of error.
        params:
          type: array
          description: For errors invovling parameters, this is an array containing the invalid parameters.
          items:
            type: string
        keys:
          type: array
          items:
            type:
            - string
            - object
        artifactLinks:
          $ref: '#/components/schemas/LinksDeprecated'
        parent:
          type: object
          properties:
            type:
              type: string
              description: A key representing the type of error generated by a request to an external API.
            error:
              type: string
              description: A static description of the parent error.
    WorkflowActionGroupPerformanceForecast:
      type: object
      properties:
        count:
          type: integer
        forecastedImpressions:
          type: integer
        forecastedEngagements:
          type: integer
        forecastedFollowers:
          type: integer
        forecastedImpressionEngagementRate:
          type: number
        forecastedFollowerEngagementRate:
          type: number
        forecastedCost:
          type: number
        forecastedCPE:
          type: number
        forecastedCPM:
          type: number
    WorkflowStatusSummary:
      type: object
      properties:
        slug:
          type: string
        ctaLabel:
          type: string
        auxiliaryLabel:
          type: string
        label:
          type: string
        enabled:
          type: string
        count:
          type: integer
        sortOrder:
          type: integer
        statusId:
          type: integer
        phase:
          type: string
    WorkflowStatusRequirementDeprecated:
      type: object
      properties:
        satisfied:
          type: boolean
        incentiveId:
          type: number
        name:
          type: string
