note: >-
  Mavrck publishes no rate limits and emits no rate-limit headers. A scan of the
  2.2 MB platform specification finds zero occurrences of "ratelimit",
  "rate-limit" or "retry-after"; the Reporting API specification and the help
  centre are equally silent. An agent integrating this API has no runtime signal
  to back off on and no documented number to design against — it can only
  discover a limit by hitting one.
