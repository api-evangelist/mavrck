standards:
- id: rfc9457
  name: RFC 9457 Problem Details for HTTP APIs
  conforms: partial
  evidence: >-
    POST https://api.mavrck.co/oauth/token returns content-type
    application/problem+json with a {type, title, detail} body — verified live
    2026-08-12. It deviates in that `type` is an opaque code (`ANL_00401`)
    rather than a URI reference, and no `instance` member is emitted. The
    548-path platform API does NOT use problem details; it returns a
    proprietary {type, error} object.
- id: oauth2
  name: OAuth 2.0 (RFC 6749)
  conforms: false
  evidence: >-
    The Reporting API performs a client-credentials-SHAPED exchange, but the
    token endpoint accepts an application/json body of clientId/clientSecret
    rather than the RFC 6749 form-encoded grant_type=client_credentials, returns
    the token in a `jwt` member rather than `access_token`, and the spec declares
    the scheme as http/bearer rather than oauth2. No scopes are defined, and
    /.well-known/oauth-authorization-server 404s on api.mavrck.co.
