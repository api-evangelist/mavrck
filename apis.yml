- aid: mavrck:mavrck-reporting-api
  name: Later Influence (Mavrck) Reporting API
  description: 'The Reporting API exposes Later Influence campaign performance for aggregation outside
    the platform: instance-level KPIs and time series, campaign performance and estimated ROI, social-network
    channel mix and return on investment, individual creator performance and post-level content analytics.
    OpenAPI 3.0.0, published by SwaggerHub owner `mavrck`. Authenticates with a clientId/clientSecret
    exchange at POST /oauth/token that returns a JWT bearer token. This v1 has been publicly announced
    as deprecated in favour of a v2 at reporting.api.later.com.'
  humanURL: https://help-influence.later.com/hc/en-us/articles/20462385592087-Implement-the-Reporting-API-for-Later-Influence
