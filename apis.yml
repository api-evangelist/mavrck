- aid: mavrck:mavrck-workflow-stage-change-webhook
  name: Mavrck Workflow Stage Change Event Webhook
  description: 'The one outbound event Mavrck (Later Influence) emits: an HTTPS POST to a subscriber-registered
    URL whenever an influencer is added to one of the subscriber''s campaigns or moves between that campaign''s
    workflow stages. Published by the provider as an OpenAPI 3.0.0 contract on SwaggerHub under owner
    `mavrck`; authorization is a static 16-character token carried in the notification body, with no signature
    header.'
  humanURL: https://app.swaggerhub.com/apis/mavrck/workflow-stage-change-event-webhook/1.0.0
