name: Mavrck
description: Mavrck is an influencer marketing platform, founded in Boston as SplashScore, Inc., that
  helps consumer brands and agencies discover creators, activate influencer and advocacy campaigns at
  scale, manage relationships, conversations and content workflows, pay creators, and measure campaign
  performance across Instagram, TikTok, Facebook, Pinterest, YouTube and Snapchat. On 17 January 2024
  Mavrck rebranded to Later and the product is now sold as Later Influence; mavrck.co serves a rebrand
  landing page, while the API host api.mavrck.co remains live and still serves both of the company's published
  machine-readable contracts. Those are a Swagger 2.0 platform document at https://api.mavrck.co/api-docs
  (548 paths, 687 operations, 1071 schema definitions, authenticated with a static api-key header) and
  an OpenAPI 3.0.0 Reporting API published by SwaggerHub owner `mavrck` (11 operations, JWT bearer tokens
  from a clientId/clientSecret exchange), plus one published webhook contract for workflow stage change
  events. API access is not self-serve — credentials are issued by a Later Influence Account Manager —
  and the v1 Reporting API has been publicly announced as deprecated in favour of reporting.api.later.com.
