  description: The full Mavrck (Later Influence) platform surface — 548 paths, 687 operations and 1071
    schema definitions covering global users and memberships, communities and lists, campaigns, action
    groups and candidates, activations, incentives and reward wins, conversations and messaging, drafts
    and deliverables, brand suitability, analytics, payments (Stripe, PayPal, Tipalti, gift cards) and
    social integrations for Meta, TikTok, Pinterest, Snapchat, YouTube, Shopify, Yotpo, Bazaarvoice and
    PowerReviews. Published as Swagger 2.0 without credentials at https://api.mavrck.co/api-docs. Authenticates
    with a static `api-key` request header.
