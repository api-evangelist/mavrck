  authorization:
    mechanism: shared static token in the request body
    field: token
    shape: 16-character alphanumeric string
    hmac_signature: false
    timestamp: false
    replay_protection: false
    assessment: >-
      Weakest common webhook auth pattern. There is no signature header for the
      subscriber to verify, so a receiver can only compare a static secret that
      Mavrck transmits in plaintext on every delivery. Rotating it requires a
      change in the platform UI.
  retry_policy:
