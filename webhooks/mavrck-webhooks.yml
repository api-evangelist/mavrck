outbound:
- name: Workflow Stage Change Event
  description: >-
    Notifies a subscriber when influencers are added to one of their campaigns
    or moved from one of that campaign's workflow stages to another.
  transport: 'HTTPS POST to a subscriber-registered URL'
  content_type: application/json
  contract: webhooks/mavrck-workflow-stage-change-event-webhook-openapi.json
