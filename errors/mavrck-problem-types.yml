summary:
  envelopes: 2
  rfc9457: partial
  note: >-
    Mavrck serves TWO different error envelopes from the same host. The platform
    API returns a proprietary `{type, error}` object with `application/json`.
    The Reporting API's token endpoint returns a genuine RFC 9457
    `application/problem+json` body with `type`/`title`/`detail` — verified
    live. There is no published error reference page for either surface; every
    entry below is derived from the specs or observed on the wire.
envelopes:
- name: platform-api-error
  format: proprietary
  content_type: application/json
  applies_to: 'https://api.mavrck.co/v1/* (548 paths, 687 operations)'
  schema_ref: openapi/_original/mavrck-openapi.json#/definitions/Error
  fields:
  - name: type
    type: string
    description: A key representing the type of error that has occurred (e.g. RESOURCE_FORBIDDEN_ERROR).
  - name: error
    type: string
    description: A static human description of the type of error.
  - name: params
    type: array
    description: For parameter errors, the array of invalid parameter names.
  - name: keys
    type: array
    description: Field keys implicated by the error.
  - name: parent
    type: object
    description: >-
      Nested `{type, error}` describing an error generated by an upstream
      third-party API (Meta, TikTok, Pinterest, Shopify, Stripe, Tipalti).
      This is the field that distinguishes a Mavrck fault from a social-network
      fault, and it is the most useful field in the envelope for an agent.
  observed:
