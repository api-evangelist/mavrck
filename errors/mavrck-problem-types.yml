status_codes:
- status: 400
  operations: 612
  titles:
  - Missing Parameter
  - Bad Request
  - Validation Failed
  - Invalid parameter.
  remediation: >-
    Read the `params` array on the envelope — it names the offending query or
    body parameters. Retry is safe once corrected.
- status: 401
  operations: 141
  titles:
  - Session expired.
  remediation: >-
    Re-authenticate. On the Reporting API, exchange clientId/clientSecret at
    POST /oauth/token for a fresh JWT; the published token lifetime is 12h
    (spec) / 24h (help centre).
- status: 403
  operations: 659
  titles:
  - Access forbidden
  - Invalid API Key
  remediation: >-
    The `api-key` header is missing, wrong, or the key's instance is not
    entitled to the resource. This is also the status returned to a completely
    unauthenticated caller — Mavrck does NOT distinguish 401 from 403 on the
    platform API, so an agent cannot tell "no credentials" from "wrong tenant"
    without out-of-band knowledge.
- status: 404
  operations: 536
  titles:
  - The resource does not exist
  - Resource Not Found
  remediation: Verify the id and that it belongs to an instance your key can reach.
- status: 409
  operations: 11
  titles:
  - Resource conflict.
  remediation: The target already exists or is in a state that forbids the transition. Do not blind-retry.
- status: 410
  operations: 1
  titles:
  - Shared link expired
  remediation: Regenerate the shareable link; the old one is permanently gone.
- status: 412
  operations: 1
  titles:
  - Invalid custom status id.
- status: 422
  operations: 18
  titles:
  - Validation Failed
  - Unprocessable Content, Invalid Query Parameters
  remediation: >-
    Note the overlap with 400 — the same class of validation failure is reported
    as 400 on 612 operations and 422 on 18. An agent must handle both.
- status: 429
  operations: 1
  titles:
  - Priority export slot is busy
  remediation: >-
    The ONLY 429 in the entire 687-operation surface, and it is a queue-slot
    conflict on the export endpoint rather than a rate limit. No Retry-After
    header is documented or observed. See rate-limits/mavrck-rate-limits.yml.
- status: 500
  operations: 685
  titles:
  - Server Error
  remediation: >-
    Retry with backoff. Where the envelope carries `parent`, the fault is in an
    upstream social network rather than in Mavrck, and retrying will not help
    until that network recovers.
